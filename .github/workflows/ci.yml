name: CI

# Pull-request / main gating: builds and runs both test suites (C# plugin +
# Rust trust core) so regressions are caught before merge. This does NOT build
# the release artifact or the multi-RID natives — that stays in release.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-publish-negative-control:
    runs-on: ubuntu-latest
    env:
      PROJECT_FILE: BTCPayServer.Plugins.RgbUtexo.csproj
    steps:
      - name: Checkout without staged gate natives
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore clean checkout (locked mode)
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT_FILE" \
            --locked-mode \
            -p:Configuration=Release \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false

      - name: Publish clean checkout (expected deficient artifact)
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_FILE" \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            -o clean-publish-out

      # This job passes only when the current pre-package delivery defect is reproduced precisely.
      # When RgbVerifyCffi is referenced from nuget.org, invert this to a normal strict-provenance
      # success check and remove the native-staging path from the positive job below.
      - name: Require exact finding-A negative control
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(python3 scripts/verify_plugin_artifact.py clean-publish-out \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          test "$STATUS" -eq 1 \
            || { echo "::error::expected verifier exit 1 for the missing gate native, got $STATUS"; exit 1; }
          EXPECTED='missing required artifact path: runtimes/linux-x64/native/librgbverifycffi.so'
          grep -Fqx "artifact verification failed: $EXPECTED" <<<"$OUTPUT" \
            || { echo "::error::clean publish failed artifact verification for a reason other than the expected finding-A payload defect"; exit 1; }

  dotnet-test:
    runs-on: ubuntu-latest
    env:
      TESTS_PROJECT: BTCPayServer.Plugins.RgbUtexo.Tests/BTCPayServer.Plugins.RgbUtexo.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      # The gate-native tests need librgbverifycffi.so on disk: runtimes/ is gitignored and nothing
      # else supplies it, so their staged-native preconditions fail the job. Staging must precede
      # the build, because the csproj's <None Include="native/rgb-verify/runtimes/**"> glob only
      # copies files that exist when MSBuild evaluates items. Mirrors release.yml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rgbverifycffi native (linux-x64)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake clang
          rustc --version && cargo --version
          bash native/rgb-verify/build-native.sh
          NATIVE=native/rgb-verify/runtimes/linux-x64/native/librgbverifycffi.so
          test -f "$NATIVE" || { echo "::error::rgbverifycffi native not produced at $NATIVE"; exit 1; }
          echo "staged $NATIVE ($(stat -c %s "$NATIVE") bytes)"

      # StaticWebAssetsEnabled=false is passed as a global property (not just on
      # the BTCPay ProjectReference) so the submodule graph resolves to a single
      # project instance. Without it the reference's differing SWA property spawns
      # a second concurrent build into the same obj/, racing on staticwebassets /
      # FileListAbsolute files (intermittent MSB3030 / MSB3491).
      - name: Restore (locked mode — packages.lock.json must match)
        run: |
          set -euo pipefail
          dotnet restore "$TESTS_PROJECT" \
            --locked-mode \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false

      - name: Test
        run: |
          set -euo pipefail
          dotnet test "$TESTS_PROJECT" \
            -c Debug \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            --logger "console;verbosity=normal"

      - name: Test artifact verifier fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Publish staged pre-package artifact (Release)
        run: |
          set -euo pipefail
          dotnet publish BTCPayServer.Plugins.RgbUtexo.csproj \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            -o ci-publish-out

      - name: Verify complete staged publish artifact
        run: |
          python3 scripts/verify_plugin_artifact.py ci-publish-out \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages"

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/rgb-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake clang

      - name: Test (release, locked)
        run: |
          set -euo pipefail
          rustc --version && cargo --version
          cargo test --release --locked
