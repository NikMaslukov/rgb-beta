name: CI

# Pull-request / main gating: builds and runs both test suites (C# plugin +
# Rust trust core) so regressions are caught before merge. This does NOT build
# the release artifact or the multi-RID natives — that stays in release.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-publish-negative-control:
    runs-on: ubuntu-latest
    env:
      PROJECT_FILE: BTCPayServer.Plugins.RgbUtexo.csproj
      TRACKED_GATE_NATIVE: native/rgb-verify/runtimes/linux-x64/native/librgbverifycffi.so
    steps:
      # A plain checkout, with no native build step anywhere in this job. That is the point: this is
      # what plugin-builder.btcpayserver.org compiles from, so the gate native this job publishes is
      # the tracked one, byte for byte.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Restore clean checkout (locked mode)
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT_FILE" \
            --locked-mode \
            -p:Configuration=Release \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false

      - name: Publish clean checkout (the tracked native is what lands)
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_FILE" \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            -o clean-publish-out

      # Bound to the TRACKED native here, which is not the self-comparison it would be elsewhere: this
      # job performs no build, so the comparison checks that MSBuild copied the tracked bytes into the
      # publish output faithfully. It cannot detect a stale tracked native -- the freshness step below
      # is what covers that -- but it does close the tracked-to-published hop that nothing else checks
      # on the path plugin-builder.btcpayserver.org actually takes.
      - name: Require the clean checkout to satisfy the artifact contract
        run: |
          python3 scripts/verify_plugin_artifact.py clean-publish-out \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages" \
            --gate-native-source "linux-x64=$TRACKED_GATE_NATIVE"

      - name: Require the published gate native to load on Debian 12 with all five exports
        run: bash scripts/verify-artifact-native-loads.sh clean-publish-out

      # The tracked native's freshness relative to the crate sources cannot be established by content
      # (a stale build passes file, nm, readelf, strings and dlopen) or by rebuilding (the binary is not
      # bit-reproducible). This compares the recorded source manifest against the tree instead.
      - name: Require the tracked gate native's source manifest to match the tree
        run: bash scripts/verify-tracked-gate-native-freshness.sh

      # The same committed-bytes gate release.yml runs, so a branch that commits an unloadable native
      # goes red here rather than at release time. A manifest binds hashes; it cannot see a glibc
      # floor, an architecture, an export set or loadability.
      - name: Require the COMMITTED gate native to pass architecture, exact exports and a Debian 12 load
        run: bash scripts/verify-committed-gate-native.sh

      # Asserting success is not a control. This mutates the published artifact into each deficient
      # variant in turn and requires the gate to reject it, naming which check fired, so the job goes
      # red if the gate stops working rather than only if the artifact is bad.
      - name: Require the gate to reject every deficient gate-native variant
        run: bash scripts/verify-gate-native-controls.sh clean-publish-out

  dotnet-test:
    runs-on: ubuntu-latest
    env:
      TESTS_PROJECT: BTCPayServer.Plugins.RgbUtexo.Tests/BTCPayServer.Plugins.RgbUtexo.Tests.csproj
      # Cargo's own output, not the tracked runtimes/ copy: native/rgb-verify/.gitignore ignores
      # /target, so this path cannot exist in a clean checkout and the gate has nothing to bind to if
      # the build step is removed or silently does nothing.
      GATE_NATIVE_BUILD: native/rgb-verify/target/release/librgbverifycffi.so
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      # runtimes/linux-x64 is tracked, so a checkout already supplies a gate native. This job rebuilds
      # it anyway, in rust:1-bookworm, so the object the managed suite loads and the object this job
      # publishes are a build of THIS checkout rather than whatever was last committed. The build must
      # still precede the dotnet build, because the csproj's
      # <None Include="native/rgb-verify/runtimes/**"> glob only copies files that exist when MSBuild
      # evaluates items. Mirrors release.yml.
      - name: Build rgbverifycffi native in rust:1-bookworm (linux-x64)
        run: |
          set -euo pipefail
          bash scripts/build-gate-native-linux-x64.sh
          echo "built $GATE_NATIVE_BUILD ($(wc -c < "$GATE_NATIVE_BUILD") bytes)"

      # StaticWebAssetsEnabled=false is passed as a global property (not just on
      # the BTCPay ProjectReference) so the submodule graph resolves to a single
      # project instance. Without it the reference's differing SWA property spawns
      # a second concurrent build into the same obj/, racing on staticwebassets /
      # FileListAbsolute files (intermittent MSB3030 / MSB3491).
      - name: Restore (locked mode — packages.lock.json must match)
        run: |
          set -euo pipefail
          dotnet restore "$TESTS_PROJECT" \
            --locked-mode \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false

      - name: Test
        run: |
          set -euo pipefail
          dotnet test "$TESTS_PROJECT" \
            -c Debug \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            --logger "console;verbosity=normal"

      - name: Test artifact verifier fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Publish staged pre-package artifact (Release)
        run: |
          set -euo pipefail
          dotnet publish BTCPayServer.Plugins.RgbUtexo.csproj \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:StaticWebAssetsEnabled=false \
            -o ci-publish-out

      - name: Verify complete staged publish artifact
        run: |
          python3 scripts/verify_plugin_artifact.py ci-publish-out \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages" \
            --gate-native-source "linux-x64=$GATE_NATIVE_BUILD"

      - name: Assert the published gate native loads on Debian 12
        run: bash scripts/verify-artifact-native-loads.sh ci-publish-out

  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/rgb-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake clang

      - name: Test (release, locked)
        run: |
          set -euo pipefail
          rustc --version && cargo --version
          cargo test --release --locked
