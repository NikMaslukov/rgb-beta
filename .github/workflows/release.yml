name: Release

# Manually triggered release pipeline.
#
# How to run:
#   1. Bump <Version> in BTCPayServer.Plugins.RgbUtexo.csproj and "version"
#      in btcpay.plugin.json on the branch you want to release from.
#   2. Push that branch.
#   3. GitHub -> Actions -> "Release" -> Run workflow.
#      - "Use workflow from" picks the branch / commit to tag.
#      - "version" must match the version inside the manifest files.
#
# The workflow will:
#   - Validate that the input version matches both manifest files.
#   - Restore dependencies in locked mode (packages.lock.json must match).
#   - Build the plugin and pack it into a `.btcpay` artifact.
#   - Create (or reuse) the tag v<version> on the chosen commit.
#   - Publish a GitHub Release with the artifact and its sha256.
#   - Generate a SLSA Level 3 build provenance attestation
#     (in-toto JSON, keyless-signed via Sigstore, recorded in Rekor)
#     and attach it to the same Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release (e.g., 1.0.6 — without the leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.subjects.outputs.hashes }}
      tag: ${{ steps.subjects.outputs.tag }}
    env:
      ARTIFACT_NAME: BTCPayServer.Plugins.RgbUtexo.btcpay
      PROJECT_FILE: BTCPayServer.Plugins.RgbUtexo.csproj
      MANIFEST_FILE: btcpay.plugin.json
      TAG: v${{ inputs.version }}
      # Cargo's own output, deliberately NOT the tracked runtimes/ copy. native/rgb-verify/.gitignore
      # ignores /target, so this path cannot exist in a clean checkout: if the build step is removed or
      # silently does nothing, the gate has no source to bind to and fails, instead of comparing the
      # shipped entry against the tracked bytes it was copied from.
      GATE_NATIVE_BUILD: native/rgb-verify/target/release/librgbverifycffi.so

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate version matches manifest files
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ inputs.version }}"

          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$INPUT_VERSION' does not look like SemVer (e.g. 1.0.6 or 1.0.6-rc1)"
            exit 1
          fi

          MANIFEST_VERSION=$(jq -r .version "$MANIFEST_FILE")
          CSPROJ_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$PROJECT_FILE")

          echo "input    : $INPUT_VERSION"
          echo "manifest : $MANIFEST_VERSION"
          echo "csproj   : $CSPROJ_VERSION"

          if [[ "$INPUT_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Input version ($INPUT_VERSION) != $MANIFEST_FILE version ($MANIFEST_VERSION). Bump the manifest first."
            exit 1
          fi
          if [[ "$INPUT_VERSION" != "$CSPROJ_VERSION" ]]; then
            echo "::error::Input version ($INPUT_VERSION) != $PROJECT_FILE <Version> ($CSPROJ_VERSION). Bump the csproj first."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      # Judges the bytes THIS COMMIT carries, read out of the git object database, before anything can
      # be tagged. The rebuild below overwrites the tracked native in the workspace, so every
      # artifact-level check after it inspects a replacement that is not what ships:
      # plugin-builder.btcpayserver.org compiles the plugin from the tag and ships the committed
      # binary. Architecture, exact exports and a Debian 12 dlopen are all properties of the object,
      # and the source manifest below can observe none of them.
      - name: Require the COMMITTED gate native to pass architecture, exact exports and a Debian 12 load
        run: |
          set -euo pipefail
          bash scripts/verify-committed-gate-native.sh
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Runs BEFORE the build, and that ordering is the whole point: the build rewrites the manifest,
      # so afterwards this would compare a record against one the same step had just written. ci.yml
      # triggers only on pull_request, push to main and manual dispatch, none of which a tag
      # publication implies, while this workflow is dispatchable on any ref, so without this step a
      # release could tag a commit whose tracked native was never freshness-checked. plugin-builder
      # builds from that tag and ships the tracked binary, so the check has to happen here too.
      - name: Require the tagged commit's tracked gate native to match its recorded sources
        run: bash scripts/verify-tracked-gate-native-freshness.sh

      # Built in rust:1-bookworm, not on the runner: ubuntu-latest links against a newer glibc than
      # BTCPay's Debian 12 images and the result fails to dlopen there. The script deletes both output
      # paths before building, so a build that compiles nothing cannot leave the tracked binary behind
      # to be mistaken for a fresh one.
      - name: Build rgbverifycffi native in rust:1-bookworm (linux-x64 = prod RID)
        run: |
          set -euo pipefail
          bash scripts/build-gate-native-linux-x64.sh
          python3 scripts/assert-native-exports.py --load "$GATE_NATIVE_BUILD"
          echo "built $GATE_NATIVE_BUILD ($(wc -c < "$GATE_NATIVE_BUILD") bytes)"

      - name: Restore (locked mode — packages.lock.json must match)
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT_FILE" \
            --locked-mode \
            -p:ContinuousIntegrationBuild=true

      - name: Publish (Release)
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT_FILE" \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -p:Deterministic=true \
            -o publish-out

      - name: Verify complete publish artifact
        run: |
          python3 scripts/verify_plugin_artifact.py publish-out \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages" \
            --gate-native-source "linux-x64=$GATE_NATIVE_BUILD"

      - name: Pack .btcpay
        run: |
          set -euo pipefail
          (cd publish-out && zip -r "../$ARTIFACT_NAME" .)
          sha256sum "$ARTIFACT_NAME" | tee "$ARTIFACT_NAME.sha256"
          ls -lh "$ARTIFACT_NAME" "$ARTIFACT_NAME.sha256"

      - name: Verify final .btcpay archive
        run: |
          python3 scripts/verify_plugin_artifact.py "$ARTIFACT_NAME" \
            --provenance pre-package \
            --package-cache "$HOME/.nuget/packages" \
            --gate-native-source "linux-x64=$GATE_NATIVE_BUILD"

      # Loads the gate native extracted from the archive that actually ships, inside Debian 12, and
      # resolves all five exports. Content checks cannot see staleness, but they do see a wrong
      # architecture, a truncated file, and a glibc floor above the deployment target.
      - name: Assert the packed gate native loads on Debian 12
        run: bash scripts/verify-artifact-native-loads.sh "$ARTIFACT_NAME"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or verify tag ${{ env.TAG }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_COMMIT:-}" ]]; then
            echo "::error::RELEASE_COMMIT is unset, so the committed-gate-native check either never ran or never recorded the commit it judged. An absent value must not read as agreement. Refusing to tag."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          if [[ "$SHA" != "$RELEASE_COMMIT" ]]; then
            echo "::error::HEAD is now $SHA but the gate native was verified on $RELEASE_COMMIT. The object that passed is not the object this tag would carry."
            exit 1
          fi
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING=$(git rev-list -n 1 "refs/tags/$TAG")
            if [[ "$EXISTING" != "$SHA" ]]; then
              echo "::error::Tag $TAG already exists at $EXISTING but workflow runs on $SHA. Refusing to move it."
              echo "::error::Either run the workflow from the correct ref, or delete the tag first."
              exit 1
            fi
            echo "Tag $TAG already exists at $SHA, reusing."
          else
            git tag -a "$TAG" -m "RGB Utexo plugin $TAG" "$SHA"
            git push origin "$TAG"
          fi

      - name: Create / replace GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing it so the artifact stays in sync."
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          ARGS=(--title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            "$ARTIFACT_NAME" \
            "$ARTIFACT_NAME.sha256" \
            "${ARGS[@]}"

      - name: Export SLSA subjects (base64 of "<sha256>  <name>")
        id: subjects
        run: |
          set -euo pipefail
          # slsa-github-generator expects a base64-encoded multi-line list of
          # "<sha256>  <name>" lines (the standard sha256sum format).
          HASHES=$(sha256sum "$ARTIFACT_NAME" | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Released $TAG"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Artifact: \`$ARTIFACT_NAME\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 "$ARTIFACT_NAME.sha256")\`"
            echo "- URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"
            echo
            echo "SLSA provenance attestation is attached by the \`provenance\` job below."
          } >> "$GITHUB_STEP_SUMMARY"

  # SLSA Level 3 generic provenance generator.
  # Runs in an isolated reusable workflow (separate runner, scoped OIDC token),
  # signs the attestation keyless via Sigstore, records it in the public Rekor
  # transparency log, and attaches `*.intoto.jsonl` to the Release created above.
  #
  # Verify with:
  #   slsa-verifier verify-artifact BTCPayServer.Plugins.RgbUtexo.btcpay \
  #     --provenance-path BTCPayServer.Plugins.RgbUtexo.btcpay.intoto.jsonl \
  #     --source-uri github.com/UTEXO-Protocol/rgb-btcpay-plugin \
  #     --source-tag vX.Y.Z
  provenance:
    needs: release
    permissions:
      actions: read       # read workflow metadata for the attestation
      id-token: write     # mint the OIDC token Sigstore uses to sign
      contents: write     # attach the *.intoto.jsonl to the Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: "${{ needs.release.outputs.tag }}"
